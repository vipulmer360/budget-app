<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <meta name="description" content="Budget - Personal & Business Account Budget Management App">
  <meta name="keywords" content="budget, accounting, income, expense, money management, ledger">
  <meta name="author" content="Budget App">

  <title>Budget - Account & Budget Management</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- App Root -->
  <div id="app">
    <!-- Loading State -->
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px">
      <img src="assets/icons/icon-192.png" alt="Budget" style="width:80px;height:80px;border-radius:16px;animation:pulse 1.5s infinite">
      <h2 style="font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Budget</h2>
      <p style="color:#64748b;font-size:0.85rem">Loading...</p>
    </div>
  </div>


  <!-- Firebase SDK (CDN — Compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts (order matters) -->
  <script src="js/utils.js?v=25"></script>
  <script src="js/db.js?v=25"></script>
  <script src="js/firebase-config.js?v=25"></script>
  <script src="js/auth.js?v=25"></script>
  <script src="js/sync.js?v=25"></script>
  <script src="js/calculations.js?v=25"></script>
  <script src="js/income.js?v=25"></script>
  <script src="js/expense.js?v=25"></script>
  <script src="js/accounts.js?v=25"></script>
  <script src="js/persons.js?v=25"></script>
  <script src="js/transactions.js?v=25"></script>
  <script src="js/dashboard.js?v=25"></script>
  <script src="js/reports.js?v=25"></script>
  <script src="js/settings.js?v=25"></script>
  <script src="js/app.js?v=25"></script>
</body>
</html>
